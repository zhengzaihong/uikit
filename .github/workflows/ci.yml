name: CI

on:
  push:
    branches:
      - master
      - dev
  pull_request:

jobs:
  analyze-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze
        run: dart analyze lib test
      - name: Test
        run: flutter test --no-pub

  example:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install dependencies
        working-directory: example
        run: flutter pub get
      - name: Analyze example
        working-directory: example
        run: dart analyze .
      - name: Test example
        working-directory: example
        run: flutter test --no-pub

  publish-dry-run:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Validate package
        run: dart pub publish --dry-run